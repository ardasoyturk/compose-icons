name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.0)'
        required: true
        type: string
      module:
        description: 'Single module to publish (e.g., lucide). Leave empty to publish all modules.'
        required: false
        default: 'lucide'
        type: string

  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Version (if workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VERSION_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Set Version (if tag push)
        if: github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Select publish task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.module }}" ]; then
            echo "PUBLISH_TASK=:${{ github.event.inputs.module }}:publishAndReleaseToMavenCentral" >> $GITHUB_ENV
          else
            echo "PUBLISH_TASK=publishAndReleaseToMavenCentral" >> $GITHUB_ENV
          fi

      - name: Prepare signing key
        env:
          SIGNING_KEY_RAW: ${{ secrets.SIGNING_KEY }}
        run: |
          KEY="$SIGNING_KEY_RAW"
          DECODED="$(echo "$SIGNING_KEY_RAW" | base64 --decode 2>/dev/null || true)"

          if echo "$DECODED" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            KEY="$DECODED"
          fi

          {
            echo "SIGNING_IN_MEMORY_KEY<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Publish and Release to Maven Central
        run: ./gradlew $PUBLISH_TASK --no-daemon --no-parallel --no-configuration-cache
        env:
          ANDROID_ONLY: "true"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION_NAME }}
