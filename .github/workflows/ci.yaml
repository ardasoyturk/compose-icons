name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: macOS-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test

  build:
    name: Build Project
    runs-on: macOS-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build -x test

  verify-icons:
    name: Verify Icon Generation
    runs-on: macOS-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Verify Simple Icons Generation
        run: ./gradlew :simple-icons:generateIcons

      - name: Verify Lucide Icons Generation
        run: ./gradlew :lucide:generateIcons