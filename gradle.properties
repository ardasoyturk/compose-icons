org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

kotlin.native.useEmbeddableCompilerJar=true
kotlin.mpp.stability.nowarn=true

# Compose Multiplatform configuration
kotlin.native.ignoreIncorrectDependencies=true

# Suppress Kotlin Hierarchy Template warnings (expected with compileOnly dependencies)
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Suppress compileOnly dependency warnings
kotlin.mpp.suppressCompileOnlyDependencyWarningForKotlinJs=true

android.defaults.buildfeatures.buildconfig = false

org.jetbrains.compose.experimental.macos.enabled=true
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true

kotlin.mpp.androidSourceSetLayoutVersion=2

# Maven (Disabled - Using JitPack instead)
# SONATYPE_HOST=DEFAULT
# SONATYPE_AUTOMATIC_RELEASE=true
# RELEASE_SIGNING_ENABLED=true

GROUP=com.github.ardasoyturk.compose.icons
VERSION_NAME=2.0.0-SNAPSHOT

POM_DESCRIPTION=Compose Multiplatform Icons - A comprehensive collection of icon packs for Compose Multiplatform
POM_URL=https://github.com/ardasoyturk/compose-icons

POM_LICENCE_NAME=The MIT License
POM_LICENCE_URL=https://github.com/ardasoyturk/compose-icons/blob/master/LICENSE
POM_LICENCE_DIST=repo

POM_SCM_URL=https://github.com/ardasoyturk/compose-icons
POM_SCM_CONNECTION=scm:git:https://github.com/ardasoyturk/compose-icons.git
POM_SCM_DEV_CONNECTION=scm:git:git@github.com:ardasoyturk/compose-icons.git

POM_DEVELOPER_ID=ardasoyturk
POM_DEVELOPER_NAME=Arda Soytürk
POM_DEVELOPER_URL=https://github.com/ardasoyturk/
POM_DEVELOPER_EMAIL=ardasoyturk@outlook.com
android.nonTransitiveRClass=false
android.nonFinalResIds=false