# JitPack configuration
jdk:
  - openjdk17

# Environment variables
env:
  JITPACK: "true"

# Build command
install:
  - ./gradlew clean assemble publishToMavenLocal -xtest -xlint

# Disable Android lint and tests to speed up build
before_install:
  - sdk install java 17.0.14-amzn
  - sdk use java 17.0.14-amzn